<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7ee8d8"/></marker></defs>
<rect width="1200" height="760" fill="#050d0e"/>
<text x="1160" y="740" text-anchor="end" font-size="13" fill="#a6bcb9">Saans Saathi on AWS (ap-south-1, Mumbai). Orange = AWS service, teal = external data, blue = users.</text>
<text x="40" y="40" font-size="13" font-weight="800" letter-spacing="2" fill="#7ee8d8">1. PEOPLE USE IT</text><rect x="40" y="60" width="190" height="80" rx="14" fill="#0e1f21" stroke="#38bdf8" stroke-width="2.2"/><text x="135.0" y="94.0" text-anchor="middle" font-size="18" font-weight="700" fill="#f3faf9">Website</text><text x="135.0" y="116.0" text-anchor="middle" font-size="13" fill="#a6bcb9">Hindi / English</text><rect x="40" y="200" width="190" height="80" rx="14" fill="#0e1f21" stroke="#38bdf8" stroke-width="2.2"/><text x="135.0" y="234.0" text-anchor="middle" font-size="18" font-weight="700" fill="#f3faf9">Telegram bot</text><text x="135.0" y="256.0" text-anchor="middle" font-size="13" fill="#a6bcb9">@SaansSaathi_bot</text><rect x="270" y="60" width="200" height="80" rx="14" fill="#0e1f21" stroke="#ff9900" stroke-width="2.2"/><text x="370.0" y="94.0" text-anchor="middle" font-size="18" font-weight="700" fill="#f3faf9">Amplify Hosting</text><text x="370.0" y="116.0" text-anchor="middle" font-size="13" fill="#a6bcb9">single-page site</text><rect x="270" y="200" width="200" height="80" rx="14" fill="#0e1f21" stroke="#ff9900" stroke-width="2.2"/><text x="370.0" y="234.0" text-anchor="middle" font-size="18" font-weight="700" fill="#f3faf9">API Gateway</text><text x="370.0" y="256.0" text-anchor="middle" font-size="13" fill="#a6bcb9">HTTP API</text><rect x="520" y="100" width="270" height="80" rx="14" fill="#0e1f21" stroke="#ff9900" stroke-width="2.2"/><text x="655.0" y="134.0" text-anchor="middle" font-size="18" font-weight="700" fill="#f3faf9">Lambda: saans-api</text><text x="655.0" y="156.0" text-anchor="middle" font-size="13" fill="#a6bcb9">advice, voice, stats</text><rect x="520" y="230" width="270" height="80" rx="14" fill="#0e1f21" stroke="#ff9900" stroke-width="2.2"/><text x="655.0" y="264.0" text-anchor="middle" font-size="18" font-weight="700" fill="#f3faf9">Lambda: saans-telegram</text><text x="655.0" y="286.0" text-anchor="middle" font-size="13" fill="#a6bcb9">bot, voice notes</text><rect x="890" y="40" width="290" height="56" rx="14" fill="#0e1f21" stroke="#5eead4" stroke-width="2.2"/><text x="1035.0" y="62.0" text-anchor="middle" font-size="18" font-weight="700" fill="#f3faf9">Open-Meteo</text><text x="1035.0" y="84.0" text-anchor="middle" font-size="13" fill="#a6bcb9">air quality, forecast, geocoding</text><rect x="890" y="106" width="290" height="56" rx="14" fill="#0e1f21" stroke="#ff9900" stroke-width="2.2"/><text x="1035.0" y="128.0" text-anchor="middle" font-size="18" font-weight="700" fill="#f3faf9">Amazon Polly</text><text x="1035.0" y="150.0" text-anchor="middle" font-size="13" fill="#a6bcb9">Hindi and English voice</text><rect x="890" y="172" width="290" height="56" rx="14" fill="#0e1f21" stroke="#ff9900" stroke-width="2.2"/><text x="1035.0" y="194.0" text-anchor="middle" font-size="18" font-weight="700" fill="#f3faf9">DynamoDB</text><text x="1035.0" y="216.0" text-anchor="middle" font-size="13" fill="#a6bcb9">checks, alert state, feedback</text><rect x="890" y="238" width="290" height="56" rx="14" fill="#0e1f21" stroke="#5eead4" stroke-width="2.2"/><text x="1035.0" y="260.0" text-anchor="middle" font-size="18" font-weight="700" fill="#f3faf9">NASA FIRMS</text><text x="1035.0" y="282.0" text-anchor="middle" font-size="13" fill="#a6bcb9">fire detections (Punjab, Haryana)</text><line x1="230" y1="100" x2="270" y2="100" stroke="#7ee8d8" stroke-width="2" marker-end="url(#a)"/><line x1="230" y1="240" x2="270" y2="240" stroke="#7ee8d8" stroke-width="2" marker-end="url(#a)"/><line x1="470" y1="225" x2="520" y2="150" stroke="#7ee8d8" stroke-width="2" marker-end="url(#a)"/><line x1="470" y1="255" x2="520" y2="270" stroke="#7ee8d8" stroke-width="2" marker-end="url(#a)"/><line x1="790" y1="120" x2="890" y2="68" stroke="#7ee8d8" stroke-width="2" marker-end="url(#a)"/><line x1="790" y1="140" x2="890" y2="134" stroke="#7ee8d8" stroke-width="2" marker-end="url(#a)"/><line x1="790" y1="160" x2="890" y2="200" stroke="#7ee8d8" stroke-width="2" marker-end="url(#a)"/><line x1="790" y1="175" x2="890" y2="266" stroke="#7ee8d8" stroke-width="2" marker-end="url(#a)"/><line x1="790" y1="270" x2="890" y2="205" stroke="#7ee8d8" stroke-width="2" marker-end="url(#a)"/><text x="40" y="360" font-size="13" font-weight="800" letter-spacing="2" fill="#7ee8d8">2. ALERTS EVERY HOUR AND EVERY MORNING</text><rect x="40" y="380" width="270" height="80" rx="14" fill="#0e1f21" stroke="#ff9900" stroke-width="2.2"/><text x="175.0" y="414.0" text-anchor="middle" font-size="18" font-weight="700" fill="#f3faf9">EventBridge Scheduler</text><text x="175.0" y="436.0" text-anchor="middle" font-size="13" fill="#a6bcb9">hourly + 7:30 AM IST</text><rect x="380" y="380" width="280" height="80" rx="14" fill="#0e1f21" stroke="#ff9900" stroke-width="2.2"/><text x="520.0" y="414.0" text-anchor="middle" font-size="18" font-weight="700" fill="#f3faf9">Lambda: saans-alert</text><text x="520.0" y="436.0" text-anchor="middle" font-size="13" fill="#a6bcb9">2 readings in a row, dust guard</text><rect x="740" y="380" width="230" height="70" rx="14" fill="#0e1f21" stroke="#ff9900" stroke-width="2.2"/><text x="855.0" y="409.0" text-anchor="middle" font-size="18" font-weight="700" fill="#f3faf9">Amazon SNS</text><text x="855.0" y="431.0" text-anchor="middle" font-size="13" fill="#a6bcb9">school email alerts</text><rect x="740" y="470" width="230" height="70" rx="14" fill="#0e1f21" stroke="#38bdf8" stroke-width="2.2"/><text x="855.0" y="499.0" text-anchor="middle" font-size="18" font-weight="700" fill="#f3faf9">Telegram</text><text x="855.0" y="521.0" text-anchor="middle" font-size="13" fill="#a6bcb9">alerts + morning update</text><line x1="310" y1="420" x2="380" y2="420" stroke="#7ee8d8" stroke-width="2" marker-end="url(#a)"/><line x1="660" y1="405" x2="740" y2="415" stroke="#7ee8d8" stroke-width="2" marker-end="url(#a)"/><line x1="660" y1="440" x2="740" y2="505" stroke="#7ee8d8" stroke-width="2" marker-end="url(#a)"/><text x="40" y="580" font-size="13" font-weight="800" letter-spacing="2" fill="#7ee8d8">3. SCHOOL MODE: 104 CITIES</text><rect x="40" y="600" width="250" height="90" rx="14" fill="#0e1f21" stroke="#ff9900" stroke-width="2.2"/><text x="165.0" y="639.0" text-anchor="middle" font-size="18" font-weight="700" fill="#f3faf9">Step Functions</text><text x="165.0" y="661.0" text-anchor="middle" font-size="13" fill="#a6bcb9">Map state over 104 cities</text><rect x="360" y="600" width="340" height="90" rx="14" fill="#0e1f21" stroke="#ff9900" stroke-width="2.2"/><text x="530.0" y="639.0" text-anchor="middle" font-size="18" font-weight="700" fill="#f3faf9">Lambda: saans-school-summary</text><text x="530.0" y="661.0" text-anchor="middle" font-size="13" fill="#a6bcb9">filters impossible AQI above 500</text><rect x="770" y="600" width="190" height="90" rx="14" fill="#0e1f21" stroke="#ff9900" stroke-width="2.2"/><text x="865.0" y="639.0" text-anchor="middle" font-size="18" font-weight="700" fill="#f3faf9">Amazon SNS</text><text x="865.0" y="661.0" text-anchor="middle" font-size="13" fill="#a6bcb9">one summary email</text><rect x="1000" y="600" width="180" height="90" rx="14" fill="#0e1f21" stroke="#ff9900" stroke-width="2.2"/><text x="1090.0" y="639.0" text-anchor="middle" font-size="18" font-weight="700" fill="#f3faf9">CloudWatch</text><text x="1090.0" y="661.0" text-anchor="middle" font-size="13" fill="#a6bcb9">Lambda logs</text><line x1="290" y1="645" x2="360" y2="645" stroke="#7ee8d8" stroke-width="2" marker-end="url(#a)"/><line x1="700" y1="645" x2="770" y2="645" stroke="#7ee8d8" stroke-width="2" marker-end="url(#a)"/></svg>